databases:
  - name: supplychain-twin-db
    databaseName: supplychain_twin
    user: supplychain_twin
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: supplychain-twin-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    disk:
      name: company-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supplychain-twin-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: /var/data/company_documents
      - key: OLLAMA_MODEL
        value: qwen2.5:0.5b
      - key: OLLAMA_PARSER_MODEL
        value: qwen2.5:3b
